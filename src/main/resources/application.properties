spring.application.name=leetcode-review-system
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/leetcode_review}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:marilyn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.port=${PORT:8080}

spring.flyway.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
coach.demo=false
coach.openai.api-key=${COACH_OPENAI_API_KEY:}
coach.openai.model=${COACH_OPENAI_MODEL:gpt-4.1-mini}
