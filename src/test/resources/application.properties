# Defaults only; LocalTestDatabaseConfiguration constructs the actual fixed datasource.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/leetcode_review_test
spring.datasource.username=marilyn
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
catalog.seed.enabled=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Explicit legacy compatibility tests use only synthetic local records.
coach.legacy-api-enabled=true

# Dedicated reviewer tests exercise enabled review; deterministic service tests stub only tutoring.
coach.tutoring-review.enabled=false
